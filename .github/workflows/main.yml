name: Build and Deployment

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` — the action reads it from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        name: Install dependencies

      - run: pnpm lint
        name: Run lintings

      - run: pnpm test
        name: Run tests

  deploy:
    name: Deploy package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          always-auth: true
          registry-url: https://registry.npmjs.org
          scope: '@spearwolf'

      - run: pnpm install --frozen-lockfile
        name: Install dependencies

      - run: pnpm dist
        name: Build package

      - run: pnpm publish:pkg
        name: Publish package
