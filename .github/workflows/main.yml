name: Build and Deployment

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  test:
    name: Run all checks, linters and tests
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Deploy package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # No `registry-url`, `scope` or `always-auth` here. `registry-url` is what
      # makes setup-node write an .npmrc carrying
      # `_authToken=${NODE_AUTH_TOKEN}` — a variable nothing in this workflow
      # sets, because the publish authenticates through OIDC (`id-token: write`
      # above, npm trusted publishing) rather than a token. Every pnpm call in
      # the job then warned that it could not resolve it. The registry comes
      # from `publishConfig` in package.json instead. `always-auth` was dropped
      # from setup-node in v4 and only earned an "unexpected input" warning.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        name: Install dependencies

      - run: pnpm dist
        name: Build package

      - run: pnpm publish:pkg
        name: Publish package
