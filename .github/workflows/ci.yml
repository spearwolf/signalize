name: Continuous Integration

on:
  push:
    branches-ignore: [ "main" ]
    paths-ignore:
      - '**.md'

jobs:
  test:
    name: Run all checks, linters and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
          run_install: true

      - run: pnpm check
        name: Run biome checks (lint + format)

      - run: pnpm test
        name: Run tests (with coverage gate)

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const fmt = (k) => \`| \${k} | \${s[k].pct}% (\${s[k].covered}/\${s[k].total}) |\`;
              const md = [
                '## Coverage',
                '',
                '| Metric | Coverage |',
                '|---|---|',
                fmt('statements'),
                fmt('branches'),
                fmt('functions'),
                fmt('lines'),
                '',
                '_Threshold: branches ≥ 85%, functions ≥ 85%, lines ≥ 95%, statements ≥ 95%._',
                ''
              ].join('\n');
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            "
          else
            echo 'No coverage-summary.json found.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
