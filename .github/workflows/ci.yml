name: Continuous Integration

on:
  push:
    branches-ignore: [ "main" ]
    paths-ignore:
      - '**.md'

jobs:
  test:
    name: Run all checks, linters and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # No `version:` — the action reads it from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        name: Install dependencies

      - run: pnpm check
        name: Run biome checks (lint + format)

      - run: pnpm test
        name: Run tests (with coverage gate)

      # `pnpm test` already covers SignalGroup.gc.spec.ts and link.gc.spec.ts
      # via the `gc` project in vitest.config.ts, on the same default `forks`
      # pool every project uses — there is no cross-file state that step
      # alone would expose. This step instead runs every file serially
      # (fileParallelism: false) with --expose-gc applied to the whole
      # suite, not just those two files.
      - run: pnpm test:gc
        name: Run full suite serially, one file at a time (--expose-gc)

      # Informative only: shared runners make absolute timings too noisy for
      # a hard regression gate (see remediation-plan.md, PERF-003). This just
      # keeps the suite itself honest — it must stay executable — and puts
      # numbers in the log for humans to eyeball.
      - run: pnpm bench
        name: Run microbenchmarks (informative, non-blocking)
        continue-on-error: true

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const fmt = (k) => \`| \${k} | \${s[k].pct}% (\${s[k].covered}/\${s[k].total}) |\`;
              const md = [
                '## Coverage',
                '',
                '| Metric | Coverage |',
                '|---|---|',
                fmt('statements'),
                fmt('branches'),
                fmt('functions'),
                fmt('lines'),
                '',
                '_Per-file thresholds: statements ≥ 97%, branches ≥ 85%, functions ≥ 96%, lines ≥ 98%; files outside the audit worklist ≥ 100%._',
                ''
              ].join('\n');
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            "
          else
            echo 'No coverage-summary.json found.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
