name: Continuous Integration

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches-ignore: [ "main" ]
    paths-ignore:
      - '**.md'
  workflow_call:

jobs:
  test:
    name: Run all checks, linters and tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Both ends of the supported range, because `engines.node` is `>=22`:
    # the floor gets run, not just declared (BUILD-009). fail-fast is off
    # so a version-specific failure stays visible as one — with it on, the
    # first red leg cancels the other and hides which versions are affected.
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      # `pnpm/setup`, not `pnpm/action-setup`. Upstream points pnpm v11 and
      # newer at the successor, and the old action is why every job logged
      # "Detected a pnpm v10 installation layout at PNPM_HOME": it bootstraps
      # pnpm through `npm ci`, sets PNPM_HOME to that `node_modules/.bin` —
      # a directory carrying a `pnpm` shim at its top level, which is exactly
      # what v11 reads as the v10 layout — and then reaches the pinned version
      # via `pnpm self-update`, the one code path that emits the notice.
      # `pnpm/setup` unpacks the self-contained binary instead and never calls
      # `self-update`, so the check is never reached.
      #
      # No `version:` — it is read from `packageManager` in package.json.
      # `install: false` because the install is its own step below and has to
      # carry `--frozen-lockfile`; the action's built-in one takes no arguments.
      - uses: pnpm/setup@v2
        with:
          install: false

      # `actions/setup-node` stays, even though `pnpm/setup` can install the
      # runtime itself via `runtime: node@…`. That route puts `node` on PATH
      # but not `npm`, which the deploy job in main.yml publishes with — and
      # both workflows running the same setup is worth more than a saved step.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        name: Install dependencies

      - run: pnpm check
        name: Run checks (biome + doc refs + banner + layering)

      - run: pnpm typecheck
        name: Type-check everything, including specs and benchmarks

      # All three checks below need the artifact they check, and `pnpm dist`
      # is `clean + compile + bundle` — `clean` deletes `coverage/`. All four
      # steps therefore run *before* `pnpm test`; behind it, the final
      # "Publish coverage summary" step would find nothing left to publish.
      - run: pnpm dist
        name: Build the shipped artifact (lib/ + dist/)

      - run: pnpm check:dts
        name: Type-check the emitted lib/*.d.ts with skipLibCheck off

      - run: pnpm test:smoke
        name: Smoke-test dist/ on plain Node (tsc-lowered decorator)

      - run: pnpm checkPkgTypes
        name: Check the exports map and the shipped types (attw, esm-only)

      - run: pnpm test
        name: Run tests (with coverage gate)

      # `pnpm test` already covers SignalGroup.gc.spec.ts and link.gc.spec.ts
      # via the `gc` project in vitest.config.ts, on the same default `forks`
      # pool every project uses — there is no cross-file state that step
      # alone would expose. This step instead runs every file serially
      # (fileParallelism: false) with --expose-gc applied to the whole
      # suite, not just those two files.
      - run: pnpm test:gc
        name: Run full suite serially, one file at a time (--expose-gc)

      # Informative only: shared runners make absolute timings too noisy for
      # a hard regression gate (see remediation-plan.md, PERF-003). This just
      # keeps the suite itself honest — it must stay executable — and puts
      # numbers in the log for humans to eyeball.
      - run: pnpm bench
        name: Run microbenchmarks (informative, non-blocking)
        # Only on the newer leg: two engines' timings in one run read like a
        # regression when they are nothing but two different JITs.
        if: matrix.node-version == '24'
        continue-on-error: true

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const fmt = (k) => \`| \${k} | \${s[k].pct}% (\${s[k].covered}/\${s[k].total}) |\`;
              const md = [
                \`## Coverage (Node \${process.version})\`,
                '',
                '| Metric | Coverage |',
                '|---|---|',
                fmt('statements'),
                fmt('branches'),
                fmt('functions'),
                fmt('lines'),
                '',
                '_Per-file thresholds: statements ≥ 97%, branches ≥ 85%, functions ≥ 96%, lines ≥ 98%; files outside the audit worklist ≥ 100%._',
                ''
              ].join('\n');
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            "
          else
            echo 'No coverage-summary.json found.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-node${{ matrix.node-version }}
          path: coverage/
          retention-days: 14
